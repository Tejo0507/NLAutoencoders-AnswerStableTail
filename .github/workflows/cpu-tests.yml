# CPU-only tests on every push and pull request.
#
# No GPU, no model download, no stored run: the suite's GPU tests are
# marked `slow` and deselected, and tests that need staged benchmarks, cached
# NLA sidecars or the stored runs skip themselves (they say why). Versions are
# those the study ran on (requirements.lock.txt); torch is the CPU build of the
# same release, because the lock file pins a local CUDA wheel.

name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running check; runs on
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Defects only (undefined names, unused imports and variables); the rule set
  # is in pyproject.toml. Pinned so a ruff release cannot fail a pull request.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: ruff
        run: |
          python -m pip install ruff==0.17.2
          ruff check --output-format=github .

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies (CPU torch, then the lock file without its CUDA wheel)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch @' requirements.lock.txt > requirements.ci.txt
          python -m pip install -r requirements.ci.txt
          python -m pip install -e . --no-deps

      - name: Consistency-checker regression tests
        run: python -m pytest tests/test_run_consistency.py -m "not slow" -rs

      - name: Full CPU suite
        run: >
          python -m pytest -m "not slow" -rs
          --junitxml=pytest-report.xml

      - name: Test report summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          if not os.path.exists("pytest-report.xml"):
              raise SystemExit(0)
          s = ET.parse("pytest-report.xml").getroot()
          s = s if s.tag == "testsuite" else s.find("testsuite")
          tests, fail, err, skip = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## CPU tests\n\n| tests | passed | failed | errors | skipped |\n"
                       "|---|---|---|---|---|\n"
                       f"| {tests} | {tests - fail - err - skip} | {fail} | {err} | {skip} |\n")
          PY

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml
